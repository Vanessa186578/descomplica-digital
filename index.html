const questions=[
{q:'Você recebe um SMS dizendo que sua conta bancária será bloqueada e pedindo para clicar em um link. O que faz?',a:['Clico no link e informo minha senha.','Abro o aplicativo oficial do banco por conta própria para verificar.','Encaminho a mensagem para minhas amigas.'],correct:1,why:'Mensagens urgentes podem ser golpes. Não use o link recebido: procure o banco pelo aplicativo ou canal oficial.'},
{q:'Uma pessoa no WhatsApp diz ser sua filha, informa que mudou de número e pede um PIX urgente. O que faz?',a:['Faço o PIX para ajudar rapidamente.','Peço apenas uma foto como confirmação.','Ligo para o número antigo ou confirmo pessoalmente antes de enviar dinheiro.'],correct:2,why:'Golpistas podem se passar por familiares. Confirme por um canal que você já conhece antes de transferir dinheiro.'},
{q:'Você encontra uma promoção com preço muito abaixo do normal em uma loja desconhecida. Qual é a atitude mais segura?',a:['Pesquisar a reputação da loja e conferir seus canais oficiais antes de comprar.','Comprar imediatamente, pois a oferta pode acabar.','Confiar porque o anúncio apareceu em uma rede social.'],correct:0,why:'Preços muito baixos e pressão para comprar podem ser sinais de fraude. Verifique a loja antes de fornecer dados ou pagar.'},
{q:'Alguém pede o código de seis dígitos que chegou por SMS para “confirmar sua conta”. O que faz?',a:['Envio, porque o código expira rápido.','Não compartilho o código com ninguém.','Publico o código em um grupo para pedir ajuda.'],correct:1,why:'Códigos de verificação protegem o acesso à sua conta. Nunca os compartilhe com quem entra em contato pedindo.'},
{q:'Qual destas senhas é mais segura?',a:['12345678','Maria2026','Uma frase longa e exclusiva, difícil de adivinhar.'],correct:2,why:'Prefira senhas longas e diferentes para cada conta. Um gerenciador de senhas pode ajudar a guardá-las.'},
{q:'Um perfil desconhecido usa a foto de uma amiga e pede dinheiro. Como agir?',a:['Confirmar com a amiga por outro meio antes de responder ou enviar dinheiro.','Enviar um valor pequeno para testar.','Confiar, porque a foto é igual à da amiga.'],correct:0,why:'Fotos e nomes podem ser copiados. Confirme a identidade por um contato que você já tinha salvo.'},
{q:'Você recebe um e-mail com anexo inesperado dizendo ser uma cobrança. O que faz?',a:['Abro o anexo para descobrir o valor.','Verifico a cobrança diretamente no site ou aplicativo oficial da empresa.','Respondo com meus dados pessoais.'],correct:1,why:'Anexos e links inesperados podem ser perigosos. Confirme a cobrança por canais oficiais, sem usar o conteúdo da mensagem.'},
{q:'Uma mensagem diz “Você ganhou um prêmio! Informe CPF, senha e dados do cartão para receber”. Qual é o sinal de alerta?',a:['O prêmio chegou por mensagem.','O texto tem emojis.','O pedido de informações sensíveis para liberar um prêmio.'],correct:2,why:'Desconfie de prêmios que exigem senhas, dados de cartão ou pagamentos antecipados.'},
{q:'Você suspeita que digitou sua senha em um site falso. Qual deve ser uma das primeiras medidas?',a:['Trocar a senha pelo site ou aplicativo oficial e revisar a segurança da conta.','Esperar alguns dias para ver se acontece algo.','Enviar a senha a uma amiga para pedir opinião.'],correct:0,why:'Altere a senha imediatamente por um canal oficial, encerre sessões desconhecidas e ative a verificação em duas etapas, quando disponível.'},
{q:'Uma pessoa diz ser do suporte técnico e pede acesso remoto ao seu celular sem que você tenha solicitado ajuda. O que faz?',a:['Permito o acesso, porque ela disse ser do suporte.','Recuso e procuro o atendimento oficial por conta própria.','Compartilho minha senha para agilizar.'],correct:1,why:'Não conceda acesso remoto ou compartilhe senhas com desconhecidos. Procure suporte somente pelos canais oficiais.'}
];

let index=0,score=0,locked=false;const app=document.getElementById('app');
function shell(inner){app.innerHTML='<div class="brand">💜 Descomplica Digital</div>'+inner+'<div class="footer">Jogo educativo gratuito • Não coletamos suas respostas nem pedimos cadastro.</div>'}
function start(){index=0;score=0;locked=false;shell('<span class="pill">Segurança digital para mulheres</span><h1>🎮 Caiu ou Não Caiu?</h1><p>Você consegue reconhecer uma tentativa de golpe? Descubra em 10 situações do dia a dia!</p><p class="muted">Escolha uma resposta por desafio. Você verá a explicação na hora e sua pontuação ao final.</p><button class="primary" id="start">Começar o jogo</button>');document.getElementById('start').onclick=showQuestion}
function showQuestion(){locked=false;const item=questions[index];shell('<span class="pill">Desafio '+(index+1)+' de '+questions.length+'</span><div class="progress" role="progressbar" aria-label="Progresso do jogo" aria-valuemin="0" aria-valuemax="10" aria-valuenow="'+index+'"><div class="bar" style="width:'+(index/questions.length*100)+'%"></div></div><img class="illustration" src="'+illustrations[index]+'" alt="Ilustração do desafio de segurança digital"><h2>'+item.q+'</h2><div class="choices" id="choices"></div><div id="response" aria-live="polite"></div>');const area=document.getElementById('choices');item.a.forEach((option,i)=>{const btn=document.createElement('button');btn.className='choice';btn.textContent=String.fromCharCode(65+i)+') '+option;btn.onclick=()=>answer(i);area.appendChild(btn)})}
function answer(selected){if(locked)return;locked=true;const item=questions[index];if(selected===item.correct)score++;const buttons=[...document.querySelectorAll('.choice')];buttons.forEach((b,i)=>{b.disabled=true;if(i===item.correct)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});const response=document.getElementById('response');const feedback=document.createElement('div');feedback.className='feedback';const heading=document.createElement('strong');heading.textContent=selected===item.correct?'✅ Muito bem! Você acertou.':'💜 Vamos aprender juntas!';const p=document.createElement('p');p.textContent=item.why;feedback.append(heading,p);response.appendChild(feedback);const next=document.createElement('button');next.className='primary';next.textContent=index===questions.length-1?'Ver meu resultado':'Próximo desafio';next.onclick=()=>{index++;index<questions.length?showQuestion():showResult()};response.appendChild(next);next.focus()}
function showResult(){const message=score>=8?'Parabéns! Você reconheceu muitos sinais de risco. Continue praticando e compartilhe o que aprendeu.':score>=5?'Você está no caminho certo! Releia as explicações dos desafios e pratique identificar pedidos urgentes e links suspeitos.':'Todo aprendizado começa com um passo! Revise os exemplos, evite links desconhecidos e confirme informações em canais oficiais.';shell('<span class="pill">Fim do jogo</span><h1>🏆 Seu resultado</h1><div class="score">'+score+' / '+questions.length+'</div><p>'+message+'</p><p class="muted">Lembre-se: nunca compartilhe senhas ou códigos de verificação. Em caso de dúvida, procure o canal oficial da empresa ou serviço.</p><button class="primary" id="again">Jogar novamente</button>');document.getElementById('again').onclick=start}
start();
</script></body></html>
